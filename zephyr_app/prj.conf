# ZephyrMLForge application configuration
# Single file: the application has no non-TFLite build, so there is no overlay.

# C++ support required by TFLite Micro
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBC=y

CONFIG_TENSORFLOW_LITE_MICRO=y

# ARM-optimised kernels. Convolution through the reference kernels is several times
# slower, which turns a usable model into one that breaches its latency budget.
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y

# Interpreter setup needs a deeper stack than the Zephyr default
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Console output parsed by the pipeline
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y

# Both are needed: REQUIRES_FLOAT_PRINTF covers the libc printf, while printk goes
# through cbprintf, which prints every %f as 0.000000 without its own switch.
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# console_getline() for the host evaluation protocol; the getline path is
# interrupt-driven and silently returns nothing without the UART IRQ support.
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# One INFER line carrying a 28x28 image is about 7 kB. The default of 128 bytes is
# silently truncated by the console driver, and the board then answers
# ERR=expected_inputs for every sample of an on-device evaluation.
CONFIG_CONSOLE_INPUT_MAX_LINE_LEN=8192

# timing_counter_get() for the latency measurement
CONFIG_TIMING_FUNCTIONS=y

# The NXP Neutron blobs are compiled hard-float, and linking them against a
# soft-float image fails with 'uses VFP register arguments'. Enabled for every build
# rather than only the NPU one, so that a CPU and an NPU measurement differ by the
# accelerator alone. Boards without an FPU ignore it.
CONFIG_FPU=y
