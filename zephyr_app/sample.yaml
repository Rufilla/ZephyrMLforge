sample:
  description: ZephyrMLForge TFLite Micro Inference Application
  name: zephyr-ml-forge inference
common:
  tags: tensorflow ml-forge
  modules:
    - tflite-micro
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "=== ZephyrMLForge inference ==="
      - "STATUS=ready"
      - "METRICS_START"
      - "latency_ms=.*"
      - "arena_used=.*"
      - "METRICS_END"
      - "Inference complete"
tests:
  sample.mlforge.inference:
    platform_allow:
      - qemu_x86
      - qemu_x86_64
    integration_platforms:
      - qemu_x86
    tags: tensorflow ml-forge
    filter: CONFIG_FULL_LIBC_SUPPORTED
  sample.mlforge.inference.cortex_m3:
    platform_allow:
      - qemu_cortex_m3
    tags: tensorflow ml-forge arm
    extra_configs:
      - CONFIG_FPU=n
